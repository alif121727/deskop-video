<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sinema AI Studio — prompt & papan cerita untuk video AI</title>
    <meta
      name="description"
      content="Studio prompt video AI: 25 template siap isi, papan cerita multi-klip dengan kunci kontinuitas, rencana konten 30 hari, dan jalur pendapatan. Kunci API Anda sendiri."
    />
    <meta name="theme-color" content="#0b0a09" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/app.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff9d2e'/%3E%3Cpath d='M13 10l9 6-9 6z' fill='%23241503'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="app">
      <aside class="rail" id="rail">
        <div class="brand">
          <div class="brand__mark">▶</div>
          <div>
            <div class="brand__name">Sinema AI</div>
            <div class="brand__sub">Studio Produksi</div>
          </div>
        </div>
        <div class="rail__label">Ruang kerja</div>
        <nav id="nav"></nav>
        <div class="rail__foot">
          <div class="rail__status">
            <span class="dot" id="key-dot"></span>
            <span id="key-status">Kunci API belum diisi</span>
          </div>
          <p class="small muted" style="margin: 10px 0 0">
            Kunci disimpan di browser Anda. Tidak ada yang dikirim ke server ini selain saat memanggil penyedia AI.
          </p>
        </div>
      </aside>

      <main class="main">
        <button class="btn btn--small menubtn" id="menubtn" type="button" style="position: fixed; top: 14px; left: 14px; z-index: 40">
          ☰ Menu
        </button>
        <div id="view"></div>
      </main>
    </div>

    <div id="modal-host"></div>
    <div class="toast-host" id="toast-host"></div>

    <script>
      // Tampilkan galat pemuatan sebagai pesan yang bisa dibaca, bukan layar kosong.
      (function () {
        function show(kind, message, detail) {
          var host = document.getElementById('boot-error');
          if (!host) {
            host = document.createElement('div');
            host.id = 'boot-error';
            host.style.cssText =
              'position:fixed;inset:auto 16px 16px 16px;z-index:999;max-width:720px;margin:0 auto;padding:16px 18px;' +
              'border:1px solid rgba(226,86,74,.5);border-radius:12px;background:#1a1611;color:#f6bdb7;' +
              'font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap';
            document.body.appendChild(host);
          }
          host.textContent = kind + '\n\n' + message + (detail ? '\n\n' + detail : '');
        }
        window.addEventListener('error', function (event) {
          show('Galat saat memuat skrip', event.message || 'Tidak diketahui',
            (event.filename || '') + (event.lineno ? ':' + event.lineno : ''));
        });
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          var message = (reason && reason.message) || String(reason);
          // TypeError "Failed to fetch" berarti permintaan tidak sampai ke server
          // (server mati atau koneksi putus), bukan kesalahan dari penyedia AI.
          if (reason && reason.name === 'TypeError' && /failed to fetch/i.test(message)) {
            message = 'Tidak bisa menghubungi server. Pastikan server masih berjalan, lalu muat ulang halaman.';
          }
          show('Permintaan gagal', message);
        });
      })();
    </script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
